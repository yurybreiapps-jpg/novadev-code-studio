<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500" role="img" aria-label="HappyKeywords: App Store keyword research for Mac">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e1b16" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="#fff9ee"/>
  <circle cx="930" cy="-40" r="230" fill="#fff0c2"/>
  <circle cx="60" cy="520" r="170" fill="#fff1d6"/>

  <!-- Brand -->
  <g transform="translate(64 92)">
    <rect width="76" height="76" rx="19" fill="#ffc83d"/>
    <circle cx="27.3" cy="30.9" r="5.3" fill="#1e1b16"/>
    <circle cx="48.7" cy="30.9" r="5.3" fill="#1e1b16"/>
    <path d="M21.4 45.1c4.2 7.1 10.1 10.7 16.6 10.7s12.4-3.6 16.6-10.7" fill="none" stroke="#1e1b16" stroke-width="5.9" stroke-linecap="round"/>
  </g>
  <text x="160" y="146" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#1e1b16">HappyKeywords</text>

  <text font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-1" fill="#1e1b16">
    <tspan x="64" y="244">Make your App Store</tspan>
    <tspan x="64" y="292">rankings happy.</tspan>
  </text>

  <text x="64" y="352" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#6b6358">Keyword research for Mac in 50+ countries</text>

  <!-- Coming soon pill -->
  <rect x="64" y="384" width="290" height="46" rx="23" fill="#ff6b2c"/>
  <text x="209" y="414" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Coming December 2026</text>

  <!-- Mini keyword board -->
  <g transform="translate(560 96)" filter="url(#shadow)">
    <rect width="400" height="300" rx="22" fill="#ffffff"/>
    <circle cx="26" cy="26" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="26" r="6" fill="#febc2e"/>
    <circle cx="66" cy="26" r="6" fill="#28c840"/>
    <line x1="0" y1="52" x2="400" y2="52" stroke="#ede3cf" stroke-width="2"/>

    <g font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6b6358">
      <text x="24" y="82">Keyword</text>
      <text x="196" y="82">US</text>
      <text x="262" y="82">DE</text>
      <text x="328" y="82">JP</text>
    </g>

    <g font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e1b16">
      <text x="24" y="132">habit tracker</text>
      <text x="24" y="184">daily routine</text>
      <text x="24" y="236">streak tracker</text>
    </g>
    <line x1="16" y1="104" x2="384" y2="104" stroke="#ede3cf" stroke-width="1.5"/>
    <line x1="16" y1="156" x2="384" y2="156" stroke="#ede3cf" stroke-width="1.5"/>
    <line x1="16" y1="208" x2="384" y2="208" stroke="#ede3cf" stroke-width="1.5"/>

    <g font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">
      <!-- row 1 -->
      <rect x="186" y="114" width="52" height="26" rx="7" fill="#dcfce7"/><text x="212" y="132" fill="#15803d">#4</text>
      <text x="278" y="133" fill="#b5aa98">—</text>
      <rect x="318" y="114" width="52" height="26" rx="7" fill="#fff1d6"/><text x="344" y="132" fill="#6b6358">#12</text>
      <!-- row 2 -->
      <rect x="186" y="166" width="52" height="26" rx="7" fill="#dcfce7"/><text x="212" y="184" fill="#15803d">#9</text>
      <rect x="252" y="166" width="52" height="26" rx="7" fill="#fff1d6"/><text x="278" y="184" fill="#6b6358">#18</text>
      <rect x="318" y="166" width="52" height="26" rx="7" fill="#ffc83d"/><text x="344" y="184" fill="#1e1b16">#3</text>
      <!-- row 3 -->
      <rect x="186" y="218" width="52" height="26" rx="7" fill="#ffc83d"/><text x="212" y="236" fill="#1e1b16">#1</text>
      <rect x="252" y="218" width="52" height="26" rx="7" fill="#dcfce7"/><text x="278" y="236" fill="#15803d">#5</text>
      <text x="344" y="237" fill="#b5aa98">—</text>
    </g>

    <rect x="16" y="258" width="368" height="28" rx="14" fill="#fff9ee"/>
    <text x="200" y="277" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6b6358">Germans search “gewohnheitstracker”</text>
  </g>
</svg>
